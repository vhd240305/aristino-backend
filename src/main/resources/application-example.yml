server:
  port: 8080

spring:
  application:
    name: aristino-backend

  datasource:
    url: jdbc:mysql://localhost:3306/aristino_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=false
    username: root
    password: your_password_here # doi lai mat khau MySQL cua ban
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'validate': Hibernate chi doi chieu entity voi schema co san (khuyen dung, vi ban da tu chay file .sql)
      # 'update'  : Hibernate tu dong sinh/sua bang - chi dung khi dang phat trien nhanh, chua co du lieu that
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org.hibernate.SQL: debug

# Cau hinh JWT - dung de sinh va kiem tra token dang nhap
jwt:
  # Chuoi bi mat dung de ky token, PHAI doi thanh chuoi rieng, du dai (>= 32 ky tu) truoc khi trien khai that
  secret: your_jwt_secret_at_least_32_characters
  # Thoi gian song cua token, tinh bang milliseconds (o day la 24 gio)
  expiration: 86400000

app.payment.mock-enabled: true
app.order.payment-timeout-minutes: 30
